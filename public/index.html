  /* =========================================================
     ADMIN NOTIFICATIONS: badge = applications waiting for a
     decision + booking requests / project briefs not yet opened.
     Shown on every [data-notif] element while signed in.
     ========================================================= */
  var SEEN_BOOKINGS_KEY = 'vh_seen_bookings', SEEN_BRIEFS_KEY = 'vh_seen_briefs';
  function seenIds(key){ try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e){ return []; } }
  function markSeenIds(key, ids){
    try {
      var all = seenIds(key);
      ids.forEach(function(id){ id = String(id); if (all.indexOf(id) === -1) all.push(id); });
      localStorage.setItem(key, JSON.stringify(all.slice(-500)));
    } catch(e){}
  }
  function attentionCounts(models, bookings, inquiries){
    var sb = seenIds(SEEN_BOOKINGS_KEY), sp = seenIds(SEEN_BRIEFS_KEY);
    var pending = (models || []).filter(function(m){ return m.status === 'pending'; }).length;
    var newB = (bookings || []).filter(function(b){ return sb.indexOf(String(b.id)) === -1; }).length;
    var newP = (inquiries || []).filter(function(q){ return sp.indexOf(String(q.id)) === -1; }).length;
    return { pending: pending, newB: newB, newP: newP, total: pending + newB + newP };
  }
  var lastNotifTotal = 0;
  function setNotif(total){
    lastNotifTotal = total;
    Array.prototype.forEach.call(document.querySelectorAll('[data-notif]'), function(el){
      el.textContent = total > 99 ? '99+' : String(total);
      el.hidden = !total;
    });
    Array.prototype.forEach.call(document.querySelectorAll('.nav-admin'), function(a){ a.hidden = !isAdmin(); });
  }
  function pollAdminNotifs(){
    setNotif(isAdmin() ? lastNotifTotal : 0);
    if (!isAdmin()) return;
    Promise.all([ fetchAdminModels(), fetchAdminBookings(), fetchAdminInquiries() ]).then(function(r){
      setNotif(attentionCounts(r[0], r[1], r[2]).total);
    }).catch(function(){});
  }
  setInterval(pollAdminNotifs, 60000);
  window.addEventListener('hashchange', function(){ setTimeout(pollAdminNotifs, 50); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) pollAdminNotifs(); });

  /* =========================================================
     ADMIN
     ========================================================= */
  function renderAdminLogin(){
    if (isAdmin()){ window.location.hash = '#/admin/dashboard'; return; }
    app.innerHTML =
      '<div class="form-page narrow">'
        + '<div class="eyebrow">Admin</div>'
        + '<h1 class="serif" style="font-size:28px;margin:12px 0 24px;">Sign in</h1>'
        + '<form id="adminForm">'
          + '<div class="field"><label>Password</label><input type="password" name="password" required></div>'
          + '<div id="adminMsg"></div>'
          + '<button type="submit" class="btn-primary full">Sign in</button>'
        + '</form>'
        + '<p class="muted" style="font-size:12px;line-height:1.7;margin-top:22px;">'
          + 'Signing in gets you a session that lasts 12 hours. Change the password from the dashboard whenever you like.'
        + '</p>'
      + '</div>';

    document.getElementById('adminForm').addEventListener('submit', function(e){
      e.preventDefault();
      var pass = e.target.password.value;
      var submitBtn = e.target.querySelector('button[type="submit"]');
      var msg = document.getElementById('adminMsg');
      msg.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      adminLogin(pass).then(function(){
        pollAdminNotifs();
        window.location.hash = '#/admin/dashboard';
      }).catch(function(err){
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
        msg.innerHTML = '<p class="form-msg-error">'+esc(err.status === 401 ? 'Incorrect password.' : (err.message || 'Could not reach the server.'))+'</p>';
      });
    });
  }

  function renderAdminDashboard(){
    if (!isAdmin()){ window.location.hash = '#/admin'; return; }
    var activeTab = 'applications';
    var activeContentTab = 'hero';
    var previewOpen = false;
    var state = { models: [], bookings: [], inquiries: [], testimonials: [], content: null };
    draw();

    // Pulls everything fresh from the API. Re-running this on every
    // tab switch keeps the dashboard simple and always in sync with
    // whatever the server has, at the cost of a small extra request.
    function loadAll(){
      return Promise.all([
        fetchAdminModels(),
        fetchAdminBookings(),
        fetchAdminInquiries(),
        fetchAdminTestimonials(),
        loadContentRemote()
      ]).then(function(results){
        state.models = results[0];
        state.bookings = results[1];
        state.inquiries = results[2];
        state.testimonials = results[3];
        state.content = results[4];
      });
    }

    function draw(){
      app.innerHTML = '<div class="admin-wrap">' + loadingHtml() + '</div>';
      loadAll().then(function(){
        drawShell();
      }).catch(function(err){
        if (handleAuthError(err)) return;
        app.innerHTML = '<div class="admin-wrap">' + errorHtml('Could not load the dashboard. Is the API running?') + '</div>';
      });
    }

    function drawShell(){
      var models = state.models.slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
      var bookings = state.bookings.slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
      var inquiries = state.inquiries.slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
      var testimonials = state.testimonials.slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
      var pending = models.filter(function(m){ return m.status === 'pending'; });
      var decided = models.filter(function(m){ return m.status !== 'pending'; });
      var counts = attentionCounts(state.models, state.bookings, state.inquiries);

      app.innerHTML =
        '<div class="admin-wrap">'
          + '<div class="admin-bar">'
            + '<div><div class="eyebrow">Admin<span class="notif-badge" data-notif hidden></span></div><h1 class="serif" style="font-size:28px;margin-top:6px;">Dashboard</h1></div>'
            + '<div style="display:flex;gap:10px;"><button class="btn" id="changePassBtn">Change password</button><button class="btn" id="signOutBtn">Sign out</button></div>'
          + '</div>'
          + '<div class="tab-row">'
            + '<button class="tab-btn'+(activeTab==='applications'?' active':'')+'" data-tab="applications">Applications'+(counts.pending?'<span class="notif-badge" data-tabbadge="applications">'+counts.pending+'</span>':'')+'</button>'
            + '<button class="tab-btn'+(activeTab==='bookings'?' active':'')+'" data-tab="bookings">Booking requests ('+bookings.length+')'+(counts.newB?'<span class="notif-badge" data-tabbadge="bookings">'+counts.newB+'</span>':'')+'</button>'
            + '<button class="tab-btn'+(activeTab==='projects'?' active':'')+'" data-tab="projects">Project briefs ('+inquiries.length+')'+(counts.newP?'<span class="notif-badge" data-tabbadge="projects">'+counts.newP+'</span>':'')+'</button>'
            + '<button class="tab-btn'+(activeTab==='testimonials'?' active':'')+'" data-tab="testimonials">Testimonials ('+testimonials.length+')</button>'
            + '<button class="tab-btn'+(activeTab==='content'?' active':'')+'" data-tab="content">Site content</button>'
          + '</div>'
          + '<div id="tabContent"></div>'
        + '</div>';

      document.getElementById('signOutBtn').addEventListener('click', function(){
        clearToken();
        setNotif(0);
        window.location.hash = '#/admin';
      });
      document.getElementById('changePassBtn').addEventListener('click', function(){
        var np = prompt('Set a new admin password (min 8 characters):');
        if (np && np.length >= 8){
          adminChangePassword(np).then(function(){
            toast('Admin password updated');
          }).catch(function(err){
            if (handleAuthError(err)) return;
            alert(err.message || 'Could not update password.');
          });
        } else if (np !== null){
          alert('Password must be at least 8 characters.');
        }
      });
      Array.prototype.forEach.call(document.querySelectorAll('.tab-btn'), function(btn){
        btn.addEventListener('click', function(){ activeTab = btn.getAttribute('data-tab'); drawShell(); });
      });

      var tabContent = document.getElementById('tabContent');
      if (activeTab === 'applications'){
        tabContent.innerHTML =
          '<div class="section-title-row"><h2>Pending ('+pending.length+')</h2></div>'
          + '<div class="admin-list">' + (pending.length === 0
              ? '<p class="empty-note" style="text-align:left;">No pending applications.</p>'
              : pending.map(appCard).join('')) + '</div>'
          + '<div class="section-title-row" style="margin-top:36px;"><h2 style="color:var(--muted);">Decided ('+decided.length+')</h2></div>'
          + '<div class="admin-list">' + (decided.length === 0
              ? '<p class="empty-note" style="text-align:left;">Nothing decided yet.</p>'
              : decided.map(function(a){
                  return '<div class="decided-row" style="align-items:center;gap:12px;flex-wrap:wrap;"><span style="flex:1;min-width:140px;">'+esc(a.fullName)+(a.stageName ? ' <em style="color:var(--gold-light);font-style:italic;">· '+esc(a.stageName)+'</em>' : '')+'</span>'
                    + '<span class="status-'+a.status+'">'+(a.status==='approved'?'approved \u00b7 live on site':a.status)+'</span>'
                    + (a.status==='approved' && a.slug ? '<a class="btn btn-small" href="#/model/'+encodeURIComponent(a.slug)+'" target="_blank" rel="noopener">View</a>' : '')
                    + (a.status==='approved'
                        ? '<button class="btn btn-small avail-btn '+(modelIsAvailable(a)?'on':'off')+'" data-avail="'+a.id+'" title="Click to switch">'+(modelIsAvailable(a)?'\u25cf Available':'\u25cf Not available')+'</button>'
                        : '')
                    + '<button class="btn btn-small" data-pmtoggle="'+a.id+'">Photos ('+((a.photoUrls||[]).length)+')</button>'
                    + '<button class="btn btn-small" data-edittoggle="'+a.id+'">Edit details</button>'
                    + '<button class="btn btn-small btn-danger" data-modeldel="'+a.id+'">Delete profile</button>'
                    + '<div data-editpanel="'+a.id+'" style="flex-basis:100%;"></div>'
                    + '<div data-pmpanel="'+a.id+'" style="flex-basis:100%;"></div></div>';
                }).join('')) + '</div>';

        Array.prototype.forEach.call(tabContent.querySelectorAll('[data-approve]'), function(btn){
          btn.addEventListener('click', function(){ setStatus(btn.getAttribute('data-approve'), 'approved'); });
        });
        Array.prototype.forEach.call(tabContent.querySelectorAll('[data-reject]'), function(btn){
          btn.addEventListener('click', function(){ setStatus(btn.getAttribute('data-reject'), 'rejected'); });
        });
        Array.prototype.forEach.call(tabContent.querySelectorAll('[data-modeldel]'), function(btn){
          btn.addEventListener('click', function(){ deleteModelLocal(btn.getAttribute('data-modeldel')); });
        });
        wirePhotoPanels(tabContent);
        wireEditPanels(tabContent);
        Array.prototype.forEach.call(tabContent.querySelectorAll('[data-avail]'), function(btn){
          btn.addEventListener('click', function(){ toggleAvailability(btn.getAttribute('data-avail'), btn); });
        });
      } else if (activeTab === 'bookings'){
        var unseenB = seenIds(SEEN_BOOKINGS_KEY);
        tabContent.innerHTML = '<div class="admin-list">' + (bookings.length === 0
          ? '<p class="empty-note" style="text-align:left;">No booking requests yet.</p>'
          : bookings.map(function(b){
              return '<div class="booking-row">'
                + '<div class="top"><span>For '+esc(b.modelName)+(unseenB.indexOf(String(b.id))===-1?'<span class="new-tag">NEW</span>':'')+'</span><span>'+new Date(b.createdAt).toLocaleDateString()+'</span></div>'
                + '<b>'+esc(b.clientName)+'</b><br>'
                + esc(b.email) + (b.phone ? ' · '+esc(b.phone) : '') + '<br>'
                + (b.message ? '<span class="muted">'+esc(b.message)+'</span>' : '')
                + '<div class="app-actions"><button class="btn btn-small btn-danger" data-bookdel="'+b.id+'">Delete</button></div>'
              + '</div>';
            }).join('')) + '</div>';
        wireRowDelete(tabContent, 'data-bookdel', 'booking request', deleteBookingAdmin, 'bookings');
        markSeenIds(SEEN_BOOKINGS_KEY, bookings.map(function(b){ return b.id; }));
        clearTabBadge('bookings');
      } else if (activeTab === 'projects'){
        var unseenP = seenIds(SEEN_BRIEFS_KEY);
        tabContent.innerHTML = '<div class="admin-list">' + (inquiries.length === 0
          ? '<p class="empty-note" style="text-align:left;">No project briefs yet.</p>'
          : inquiries.map(function(p){
              return '<div class="booking-row">'
                + '<div class="top"><span>'+esc(p.projectType || 'Project inquiry')+(unseenP.indexOf(String(p.id))===-1?'<span class="new-tag">NEW</span>':'')+'</span><span>'+new Date(p.createdAt).toLocaleDateString()+'</span></div>'
                + '<b>'+esc(p.brandName)+'</b>, '+esc(p.contactName)+'<br>'
                + esc(p.email) + (p.phone ? ' · '+esc(p.phone) : '') + '<br>'
                + (p.budget ? '<span class="muted">Budget: '+esc(p.budget)+'</span><br>' : '')
                + (p.timeline ? '<span class="muted">Timeline: '+esc(p.timeline)+'</span><br>' : '')
                + '<span class="muted">'+esc(p.message)+'</span>'
                + '<div class="app-actions"><button class="btn btn-small btn-danger" data-projdel="'+p.id+'">Delete</button></div>'
              + '</div>';
            }).join('')) + '</div>';
        wireRowDelete(tabContent, 'data-projdel', 'project brief', deleteInquiryAdmin, 'inquiries');
        markSeenIds(SEEN_BRIEFS_KEY, inquiries.map(function(q){ return q.id; }));
        clearTabBadge('projects');
      } else if (activeTab === 'testimonials'){
        tabContent.innerHTML =
          '<p class="muted" style="font-size:12.5px;margin:-6px 0 20px;">These go live the moment someone submits them. Hide or delete anything that shouldn\'t be public.</p>'
          + '<div class="admin-list">' + (testimonials.length === 0
            ? '<p class="empty-note" style="text-align:left;">No testimonials submitted yet.</p>'
            : testimonials.map(function(t){
                return '<div class="booking-row" data-testirow="'+t.id+'">'
                  + '<div class="top"><span>'+esc(t.name)+(t.role ? ' · '+esc(t.role) : '')+'</span><span>'+new Date(t.createdAt).toLocaleDateString()+'</span></div>'
                  + '<span class="muted">'+esc(t.quote)+'</span><br>'
                  + '<span class="status-'+(t.status==='approved'?'approved':'rejected')+'" style="display:inline-block;margin-top:8px;">'+t.status+'</span>'
                  + '<div class="app-actions" style="margin-top:12px;">'
                    + (t.status === 'approved'
                        ? '<button class="btn" data-testihide="'+t.id+'">Hide</button>'
                        : '<button class="btn-primary" data-testishow="'+t.id+'">Show</button>')
                    + '<button class="btn" data-testidelete="'+t.id+'">Delete</button>'
                  + '</div>'
                + '</div>';
              }).join('')) + '</div>';

        Array.prototype.forEach.call(tabContent.querySelectorAll('[data-testihide]'), function(btn){
          btn.addEventListener('click', function(){ setTestimonialStatusLocal(btn.getAttribute('data-testihide'), 'hidden'); });
        });
        Array.prototype.forEach.call(tabContent.querySelectorAll('[data-testishow]'), function(btn){
          btn.addEventListener('click', function(){ setTestimonialStatusLocal(btn.getAttribute('data-testishow'), 'approved'); });
        });
        Array.prototype.forEach.call(tabContent.querySelectorAll('[data-testidelete]'), function(btn){
          btn.addEventListener('click', function(){
            if (!confirm('Delete this testimonial? This cannot be undone.')) return;
            var id = btn.getAttribute('data-testidelete');
            deleteTestimonialAdmin(id).then(function(){
              state.testimonials = state.testimonials.filter(function(x){ return x.id !== id; });
              toast('Testimonial deleted');
              drawShell();
            }).catch(function(err){
              if (handleAuthError(err)) return;
              alert(err.message || 'Could not delete this testimonial.');
            });
          });
        });
      } else {
        renderContentTab(tabContent);
      }
      syncBadges();
    }

    function syncBadges(){
      setNotif(attentionCounts(state.models, state.bookings, state.inquiries).total);
    }
    function clearTabBadge(name){
      var el = document.querySelector('[data-tabbadge="'+name+'"]');
      if (el) el.remove();
    }

    /* ---- Talent photo manager: upload several, preview, reorder, save ---- */
    var editOpen = {};   // modelId -> true while its "Edit details" form is open
    var pmWork = {};   // modelId -> { urls: [...], orig: '...', busy: bool }
    function pmDirty(w){ return JSON.stringify(w.urls) !== w.orig; }
    function pmFind(id){ return state.models.find(function(x){ return String(x.id) === String(id); }); }
    function pmEnlarge(urls, i, name){
      galleryImages = urls.slice();
      galleryCategory = name;
      openLightbox(i);
    }
    /* ---- Edit details: admin can change anything the model wrote, before or after approving ---- */
    var EDIT_CATS = ['Fashion','Beauty','Lifestyle','Commercial','Fitness','Editorial'];
    var EDIT_BODY = ['Slim','Curvy','Plus-size','Muscular','Average'];
    function editInput(label, name, val, type){
      return '<div class="field"><label>'+label+'</label><input type="'+(type||'text')+'" name="'+name+'" value="'+esc(val||'')+'"></div>';
    }
    function editSelect(label, name, opts, val){
      var list = opts.slice();
      if (val && list.indexOf(val) === -1) list.push(val);
      return '<div class="field"><label>'+label+'</label><select name="'+name+'">'
        + list.map(function(o){ return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'; }).join('') + '</select></div>';
    }
    function wireEditPanels(root){
      Array.prototype.forEach.call(root.querySelectorAll('[data-edittoggle]'), function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-edittoggle');
          if (editOpen[id]) delete editOpen[id]; else editOpen[id] = true;
          paintEditPanel(root, id);
        });
      });
      Object.keys(editOpen).forEach(function(id){ paintEditPanel(root, id); });
    }
    function paintEditPanel(root, id){
      var host = root.querySelector('[data-editpanel="'+id+'"]');
      if (!host) return;
      var m = pmFind(id);
      if (!m || !editOpen[id]){ host.innerHTML = ''; return; }
      var canApprove = m.status !== 'approved';
      host.innerHTML =
        '<form class="edit-form" novalidate>'
          + '<h4>Edit details for '+esc(m.fullName)+'</h4>'
          + '<p class="pm-hint">Change, remove or add to anything the model wrote, then save. '+(canApprove ? 'You can save and approve in one step.' : 'Changes show on the live site straight away.')+'</p>'
          + '<div class="edit-grid">'
            + editInput('Full name','fullName', m.fullName)
            + editInput('Model stage name','stageName', m.stageName)
            + editInput('Email','email', m.email, 'email')
            + editInput('Phone / WhatsApp','phone', m.phone)
            + editSelect('Category','category', EDIT_CATS, m.category)
            + editSelect('Body type','bodyType', EDIT_BODY, m.bodyType)
            + editInput('Height','height', m.height)
            + editInput('Based in','basedIn', m.basedIn)
            + editInput('Instagram handle','instagram', m.instagram)
          + '</div>'
          + '<div class="field"><label>Bio</label><textarea name="bio" rows="5">'+esc(m.bio||'')+'</textarea></div>'
          + '<div class="pm-bar">'
            + '<button type="submit" class="btn-primary" data-editsave>Save changes</button>'
            + (canApprove ? '<button type="button" class="btn-primary" data-editapprove>Save &amp; approve</button>' : '')
            + '<button type="button" class="btn" data-editcancel>Cancel</button>'
          + '</div>'
        + '</form>';
      var form = host.querySelector('form');
      function save(thenApprove){
        var f = form.elements;
        var fields = {
          fullName: f.fullName.value.trim(), stageName: f.stageName.value.trim(),
          email: f.email.value.trim(), phone: f.phone.value.trim(),
          category: f.category.value, bodyType: f.bodyType.value,
          height: f.height.value.trim(), basedIn: f.basedIn.value.trim(),
          instagram: f.instagram.value.trim(), bio: f.bio.value.trim()
        };
        if (!fields.fullName){ alert('Full name cannot be empty.'); return; }
        Array.prototype.forEach.call(form.querySelectorAll('button'), function(b){ b.disabled = true; });
        updateModelDetails(id, fields).then(function(updated){
          // If the server sent the profile back, make sure it really kept every change.
          if (updated && updated.fullName !== undefined){
            var dropped = Object.keys(fields).filter(function(k){
              return String(updated[k] == null ? '' : updated[k]) !== fields[k];
            });
            if (dropped.length){
              Array.prototype.forEach.call(form.querySelectorAll('button'), function(b){ b.disabled = false; });
              alert('The server did not save: ' + dropped.join(', ') + '.\n\nThe backend needs a small update to accept these fields. Nothing was approved.');
              return;
            }
            Object.assign(m, updated);
          } else {
            Object.assign(m, fields);
          }
          dropModelCache();
          delete editOpen[id];
          if (thenApprove){ setStatus(id, 'approved'); }
          else { toast('Details saved'); drawShell(); }
        }).catch(function(err){
          Array.prototype.forEach.call(form.querySelectorAll('button'), function(b){ b.disabled = false; });
          if (handleAuthError(err)) return;
          alert(err.message || 'Could not save these details.');
        });
      }
      form.addEventListener('submit', function(e){ e.preventDefault(); save(false); });
      var ap = form.querySelector('[data-editapprove]');
      if (ap) ap.addEventListener('click', function(){ save(true); });
      form.querySelector('[data-editcancel]').addEventListener('click', function(){ delete editOpen[id]; paintEditPanel(root, id); });
    }

    function wirePhotoPanels(root){
      Array.prototype.forEach.call(root.querySelectorAll('[data-pmtoggle]'), function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-pmtoggle'), m = pmFind(id);
          if (!m) return;
          if (pmWork[id]){
            if (pmDirty(pmWork[id]) && !confirm('Close without saving your photo changes?')) return;
            delete pmWork[id];
          } else {
            pmWork[id] = { urls: (m.photoUrls || []).slice(), orig: JSON.stringify(m.photoUrls || []), busy: false };
          }
          paintPhotoPanel(root, id);
        });
      });
      Array.prototype.forEach.call(root.querySelectorAll('[data-pmview]'), function(btn){
        btn.addEventListener('click', function(){
          var m = pmFind(btn.getAttribute('data-pmview'));
          if (m) pmEnlarge(m.photoUrls || [], parseInt(btn.getAttribute('data-pmi'), 10), m.fullName);
        });
      });
      Object.keys(pmWork).forEach(function(id){ paintPhotoPanel(root, id); });
    }
    function paintPhotoPanel(root, id){
      var host = root.querySelector('[data-pmpanel="'+id+'"]');
      if (!host) return;
      var w = pmWork[id], m = pmFind(id);
      if (!w || !m){ host.innerHTML = ''; return; }
      host.innerHTML =
        '<div class="pm-panel">'
          + '<h4>Photos for '+esc(m.fullName)+'</h4>'
          + '<p class="pm-hint">The first photo is the cover on the roster. Use the arrows or "Make first" to reorder, tap a picture to enlarge, then press Save photos.</p>'
          + (w.urls.length
              ? '<div class="pm-grid">' + w.urls.map(function(u,i){
                  return '<div class="pm-item'+(i===0?' is-first':'')+'">'
                    + '<img src="'+u+'" alt="Photo '+(i+1)+'" data-pmz="'+i+'">'
                    + (i===0 ? '<span class="pm-badge">Cover</span>' : '<span class="pm-num">'+(i+1)+'</span>')
                    + '<button type="button" class="pm-rm" data-pmrm="'+i+'" title="Remove photo">&times;</button>'
                    + '<div class="pm-ctrl">'
                      + '<button type="button" data-pmleft="'+i+'" title="Move earlier"'+(i===0?' disabled':'')+'>&larr;</button>'
                      + '<button type="button" data-pmfirst="'+i+'" title="Make first"'+(i===0?' disabled':'')+'>1st</button>'
                      + '<button type="button" data-pmright="'+i+'" title="Move later"'+(i===w.urls.length-1?' disabled':'')+'>&rarr;</button>'
                    + '</div>'
                  + '</div>';
                }).join('') + '</div>'
              : '<p class="empty-note" style="text-align:left;">No photos yet.</p>')
          + '<div class="field" style="margin-top:16px;"><label>Add photos (you can pick several)</label><input type="file" accept="image/*" multiple data-pmup></div>'
          + '<div class="pm-bar">'
            + '<button type="button" class="btn-primary" data-pmsave'+(w.busy||!pmDirty(w)?' disabled':'')+'>'+(w.busy?'Working…':'Save photos')+'</button>'
            + '<button type="button" class="btn" data-pmcancel>Close</button>'
            + (pmDirty(w) ? '<span class="pm-dirty">Unsaved changes</span>' : '')
          + '</div>'
        + '</div>';

      function again(){ paintPhotoPanel(root, id); }
      function move(from, to){
        if (to < 0 || to >= w.urls.length) return;
        var it = w.urls.splice(from, 1)[0];
        w.urls.splice(to, 0, it);
        again();
      }
      function each(sel, fn){ Array.prototype.forEach.call(host.querySelectorAll(sel), fn); }
      each('[data-pmz]', function(el){ el.addEventListener('click', function(){ pmEnlarge(w.urls, parseInt(el.getAttribute('data-pmz'),10), m.fullName); }); });
      each('[data-pmleft]', function(el){ el.addEventListener('click', function(){ var i = parseInt(el.getAttribute('data-pmleft'),10); move(i, i-1); }); });
      each('[data-pmright]', function(el){ el.addEventListener('click', function(){ var i = parseInt(el.getAttribute('data-pmright'),10); move(i, i+1); }); });
      each('[data-pmfirst]', function(el){ el.addEventListener('click', function(){ move(parseInt(el.getAttribute('data-pmfirst'),10), 0); }); });
      each('[data-pmrm]', function(el){
        el.addEventListener('click', function(){
          if (!confirm('Remove this photo?')) return;
          w.urls.splice(parseInt(el.getAttribute('data-pmrm'),10), 1);
          again();
        });
      });
      var up = host.querySelector('[data-pmup]');
      up.addEventListener('change', function(e){
        var files = Array.prototype.slice.call(e.target.files || []);
        if (!files.length) return;
        var room = 12 - w.urls.length;
        if (room <= 0){ alert('A profile can have up to 12 photos. Remove one first.'); return; }
        if (files.length > room){ alert('Only the first ' + room + ' photo(s) were added (max 12 per profile).'); files = files.slice(0, room); }
        w.busy = true; again();
        Promise.all(files.map(function(f){ return fileToCompressedDataUrl(f, 1400, 0.8); })).then(function(urls){
          w.urls = w.urls.concat(urls);
          w.busy = false; again();
          toast(urls.length + ' photo(s) added. Review, reorder, then Save photos');
        }).catch(function(){
          w.busy = false; again();
          alert('One of those files could not be read as an image.');
        });
      });
      host.querySelector('[data-pmcancel]').addEventListener('click', function(){
        if (pmDirty(w) && !confirm('Close without saving your photo changes?')) return;
        delete pmWork[id]; again();
      });
      host.querySelector('[data-pmsave]').addEventListener('click', function(){
        if (!w.urls.length && !confirm('This profile will have no photos. Continue?')) return;
        w.busy = true; again();
        setModelPhotos(id, w.urls).then(function(updated){
          m.photoUrls = (updated && updated.photoUrls) ? updated.photoUrls : w.urls.slice();
          dropModelCache();
          delete pmWork[id];
          toast('Photos saved');
          drawShell();
        }).catch(function(err){
          w.busy = false; again();
          if (handleAuthError(err)) return;
          alert(err.message || 'Could not save these photos.');
        });
      });
    }

    function toggleAvailability(id, btn){
      var m = pmFind(id);
      if (!m) return;
      var next = modelIsAvailable(m) ? 'Not available' : 'Available';
      btn.disabled = true;
      setModelAvailability(id, next).then(function(updated){
        m.availability = (updated && updated.availability) ? updated.availability : next;
        dropModelCache();
        toast(m.fullName + (next === 'Available' ? ' is now available for booking' : ' is now marked not available'));
        drawShell();
      }).catch(function(err){
        btn.disabled = false;
        if (handleAuthError(err)) return;
        alert(err.message || 'Could not update availability.');
      });
    }

    function deleteModelLocal(id){
      var m = state.models.find(function(x){ return x.id === id; });
      if (!m) return;
      var live = m.status === 'approved' ? ' It will be removed from the website.' : '';
      if (!confirm('Delete ' + m.fullName + '\'s whole profile, with all photos and details?' + live + ' This cannot be undone.')) return;
      deleteModelAdmin(id).then(function(){
        state.models = state.models.filter(function(x){ return x.id !== id; });
        dropModelCache();
        toast(m.fullName + ' deleted');
        drawShell();
      }).catch(function(err){
        if (handleAuthError(err)) return;
        alert(err.message || 'Could not delete this profile.');
      });
    }

    function wireRowDelete(container, attr, label, deleteFn, stateKey){
      Array.prototype.forEach.call(container.querySelectorAll('['+attr+']'), function(btn){
        btn.addEventListener('click', function(){
          if (!confirm('Delete this ' + label + '? This cannot be undone.')) return;
          var id = btn.getAttribute(attr);
          deleteFn(id).then(function(){
            state[stateKey] = state[stateKey].filter(function(x){ return x.id !== id; });
            toast(label.charAt(0).toUpperCase() + label.slice(1) + ' deleted');
            drawShell();
          }).catch(function(err){
            if (handleAuthError(err)) return;
            alert(err.message || 'Could not delete this ' + label + '.');
          });
        });
      });
    }

    function renderContentTab(container){
      var content = state.content;
      var subtabs = [
        {id:'hero', label:'Hero'},
        {id:'whatwedo', label:'What we do'},
        {id:'stats', label:'Stats'},
        {id:'seenin', label:'As seen in'},
        {id:'brands', label:'Brands'},
        {id:'portfolio', label:'Portfolio'},
        {id:'testimonials', label:'Testimonials'},
        {id:'about', label:'About'},
        {id:'contact', label:'Contact'}
      ];
      var previewUrl = window.location.pathname + window.location.search + '#/';
      container.innerHTML =
        '<div class="content-panel'+(previewOpen?' split-active':'')+'">'
          + '<div class="content-toolbar">'
            + '<div class="content-subtabs">' + subtabs.map(function(s){
                return '<button type="button" class="content-subtab-btn'+(activeContentTab===s.id?' active':'')+'" data-csub="'+s.id+'">'+s.label+'</button>';
              }).join('') + '</div>'
            + '<button type="button" class="btn'+(previewOpen?' active':'')+'" id="previewToggleBtn">'+(previewOpen?'Hide live preview':'Live preview')+'</button>'
          + '</div>'
          + (previewOpen
              ? '<div class="content-panel-split">'
                  + '<div id="contentSubPanel"></div>'
                  + '<div class="preview-frame-wrap">'
                    + '<div class="preview-frame-head"><span>Live preview of the homepage</span><a href="'+previewUrl+'" target="_blank" rel="noopener">Open in new tab &#8599;</a></div>'
                    + '<div class="preview-frame-body"><iframe id="previewFrame" src="'+previewUrl+'" title="Site preview"></iframe></div>'
                  + '</div>'
                + '</div>'
              : '<div id="contentSubPanel"></div>')
        + '</div>';

      document.getElementById('previewToggleBtn').addEventListener('click', function(){
        previewOpen = !previewOpen;
        renderContentTab(container);
      });

      Array.prototype.forEach.call(container.querySelectorAll('.content-subtab-btn'), function(btn){
        btn.addEventListener('click', function(){ activeContentTab = btn.getAttribute('data-csub'); renderContentTab(container); });
      });

      var panel = document.getElementById('contentSubPanel');
      if (activeContentTab === 'hero') renderHeroPanel(panel, content);
      else if (activeContentTab === 'whatwedo') renderWhatWeDoPanel(panel, content);
      else if (activeContentTab === 'stats') renderStatsPanel(panel, content);
      else if (activeContentTab === 'seenin') renderSeenInPanel(panel, content);
      else if (activeContentTab === 'brands') renderBrandsPanel(panel, content);
      else if (activeContentTab === 'portfolio') renderPortfolioPanel(panel, content);
      else if (activeContentTab === 'testimonials') renderTestimonialsPanel(panel, content);
      else if (activeContentTab === 'about') renderAboutPanel(panel, content);

    function bgSlotHtml(b, key, label){
      var img = b[key+'Image'], custom = !!img;

      var x = clampPct(b[key+'PosX'], DEFAULT_CONTENT.brands[key+'PosX']);
      var y = clampPct(b[key+'PosY'], DEFAULT_CONTENT.brands[key+'PosY']);
      var bg = 'background-image:url(\''+src+'\');background-position:'+x+'% '+y+'%;';
      return '<div class="bg-slot" data-bgslot="'+key+'">'
        + '<h4>Background photo</h4>'
        + '<p class="hint">'+(custom ? 'Your uploaded photo is showing on the homepage.' : 'The built-in photo is showing. Upload your own to replace it.')+' Use the sliders to choose which part of the photo stays in view when it is cropped.</p>'
        + '<div class="bg-previews">'
          + '<div class="bg-prev-wrap">Desktop<div class="bg-prev bg-prev--d" data-bgprev style="'+bg+'"><span>'+esc(label)+'</span></div></div>'
          + '<div class="bg-prev-wrap">Phone<div class="bg-prev bg-prev--m" data-bgprev style="'+bg+'"><span>'+esc(label)+'</span></div></div>'
        + '</div>'
        + '<div class="bg-sliders">'
          + '<div><label>Left &harr; Right</label><input type="range" min="0" max="100" value="'+x+'" data-bgx></div>'
          + '<div><label>Top &harr; Bottom</label><input type="range" min="0" max="100" value="'+y+'" data-bgy></div>'
        + '</div>'
        + '<div class="bg-actions">'
          + '<label class="btn btn-small" style="cursor:pointer;">'+(custom ? 'Replace photo' : 'Upload photo')+'<input type="file" accept="image/*" data-bgfile></label>'
          + (custom ? '<button type="button" class="btn btn-small btn-danger" data-bgreset>Reset to default</button>' : '')
          + '<span class="bg-status" data-bgstatus></span>'
        + '</div>'
      + '</div>';
    }
    function wireBgSlot(panel, content, key){
      var b = content.brands;
      var slot = panel.querySelector('[data-bgslot="'+key+'"]');
      if (!slot) return;
      var xIn = slot.querySelector('[data-bgx]'), yIn = slot.querySelector('[data-bgy]');
      var status = slot.querySelector('[data-bgstatus]');
      function paintPos(){
        Array.prototype.forEach.call(slot.querySelectorAll('[data-bgprev]'), function(el){
          el.style.backgroundPosition = xIn.value + '% ' + yIn.value + '%';
        });
      }
      xIn.addEventListener('input', paintPos);
      yIn.addEventListener('input', paintPos);
      function savePos(){
        b[key+'PosX'] = clampPct(xIn.value, 50);
        b[key+'PosY'] = clampPct(yIn.value, 50);
        saveContent(content);
        toast('Photo position saved');
      }
      xIn.addEventListener('change', savePos);
      yIn.addEventListener('change', savePos);

      slot.querySelector('[data-bgfile]').addEventListener('change', function(e){
        var file = (e.target.files || [])[0];
        if (!file) return;
        if (!/^image\//.test(file.type)){ toast('Please choose an image file'); return; }
        status.textContent = 'Uploading\u2026';
        // 1600px wide covers the desktop panel; the same file is reused on phones.
        fileToCompressedDataUrl(file, 1600, 0.78).then(function(url){
          b[key+'Image'] = url;
          saveContent(content);
          toast('Background photo updated');
          renderBrandsPanel(panel, content);
        }).catch(function(){
          status.textContent = 'Could not read that image. Try a JPG or PNG.';
        });
      });

      var reset = slot.querySelector('[data-bgreset]');
      if (reset) reset.addEventListener('click', function(){
        b[key+'Image'] = '';
        saveContent(content);
        toast('Back to the default photo');
        renderBrandsPanel(panel, content);
      });
    }

    function renderBrandsPanel(panel, content){
      var b = content.brands;
      panel.innerHTML =
        '<div class="content-block">'
          + '<h3>For models</h3>'
          + '<form id="brandsModelsForm">'
            + cField('Eyebrow','modelsEyebrow', b.modelsEyebrow)
            + cField('Title','modelsTitle', b.modelsTitle)
            + '<div class="field"><label>Body</label><textarea name="modelsBody" rows="3">'+esc(b.modelsBody)+'</textarea></div>'
            + '<button type="submit" class="btn-primary">Save</button>'
          + '</form>'
          + bgSlotHtml(b, 'models', b.modelsTitle)
        + '</div>'
        + '<div class="content-block">'
          + '<h3>For brands</h3>'
          + '<form id="brandsBrandsForm">'
            + cField('Eyebrow','brandsEyebrow', b.brandsEyebrow)
            + cField('Title','brandsTitle', b.brandsTitle)
            + '<div class="field"><label>Body</label><textarea name="brandsBody" rows="3">'+esc(b.brandsBody)+'</textarea></div>'
            + '<button type="submit" class="btn-primary">Save</button>'
          + '</form>'
          + bgSlotHtml(b, 'brands', b.brandsTitle)
        + '</div>';
      wireBgSlot(panel, content, 'models');
      wireBgSlot(panel, content, 'brands');

      document.getElementById('brandsModelsForm').addEventListener('submit', function(e){
        e.preventDefault();
        var f = e.target;
        b.modelsEyebrow = f.modelsEyebrow.value.trim();
        b.modelsTitle = f.modelsTitle.value.trim();
        b.modelsBody = f.modelsBody.value.trim();
        saveContent(content);
        toast('Saved');
      });
      document.getElementById('brandsBrandsForm').addEventListener('submit', function(e){
        e.preventDefault();
        var f = e.target;
        b.brandsEyebrow = f.brandsEyebrow.value.trim();
        b.brandsTitle = f.brandsTitle.value.trim();
        b.brandsBody = f.brandsBody.value.trim();
        saveContent(content);
        toast('Saved');
      });
    }

    function renderPortfolioPanel(panel, content){
      var p = content.portfolio;

      panel.innerHTML =
        '<div class="content-block">'
          + '<h3>Section heading</h3>'
          + '<form id="pfHeadForm">'
            + cField('Eyebrow','eyebrow', p.eyebrow)
            + cField('Title','title', p.title)
            + '<button type="submit" class="btn-primary">Save</button>'
          + '</form>'
        + '</div>'
        + p.categories.map(function(cat){
            return '<div class="content-block category-block">'
              + '<div class="category-block-head">'
                + '<input type="text" class="cat-name-input" value="'+esc(cat.name)+'">'
                + '<div class="actions">'
                  + '<button type="button" class="btn btn-small" data-catrename="1">Rename</button>'
                  + '<button type="button" class="btn btn-small btn-danger" data-catdel="1">Delete category</button>'
                + '</div>'
              + '</div>'
              + imageManagerHtml(cat.images)
              + '<div class="field" style="margin-top:12px;"><input type="file" class="cat-upload" accept="image/*" multiple></div>'
            + '</div>';
          }).join('')
        + '<div class="content-block">'
          + '<h3>Add a category</h3>'
          + '<form id="pfAddCatForm" class="inline-form">'
            + '<input type="text" name="cat_name" placeholder="e.g. Swim">'
            + '<button type="submit" class="btn">Add</button>'
          + '</form>'
        + '</div>';

      document.getElementById('pfHeadForm').addEventListener('submit', function(e){
        e.preventDefault();
        var f = e.target;
        p.eyebrow = f.eyebrow.value.trim();
        p.title = f.title.value.trim();
        saveContent(content);
        toast('Saved');
      });

      document.getElementById('pfAddCatForm').addEventListener('submit', function(e){
        e.preventDefault();
        var val = e.target.cat_name.value.trim();
        if (!val) return;
        p.categories.push({name: val, images: []});
        saveContent(content);
        toast('Category added');
        renderPortfolioPanel(panel, content);
      });

      Array.prototype.forEach.call(panel.querySelectorAll('.category-block'), function(block, ci){
        var cat = p.categories[ci];
        cat.images = cat.images || [];

        wireImageDeletes(block, cat.images, function(){
          saveContent(content);
          toast('Image removed');
          renderPortfolioPanel(panel, content);
        });

        block.querySelector('.cat-upload').addEventListener('change', function(e){
          var files = Array.prototype.slice.call(e.target.files || []);
          if (!files.length) return;
          Promise.all(files.map(function(f){ return fileToCompressedDataUrl(f, 1000, 0.75); }))
            .then(function(urls){
              cat.images = cat.images.concat(urls);
              saveContent(content);
              toast('Image(s) added to ' + cat.name);
              renderPortfolioPanel(panel, content);
            });
        });

        block.querySelector('[data-catrename]').addEventListener('click', function(){
          var val = block.querySelector('.cat-name-input').value.trim();
          if (!val) return;
          cat.name = val;
          saveContent(content);
          toast('Category renamed');
          renderPortfolioPanel(panel, content);
        });

        block.querySelector('[data-catdel]').addEventListener('click', function(){
          if (!confirm('Delete category "'+cat.name+'" and its images?')) return;
          p.categories.splice(ci, 1);
          saveContent(content);
          toast('Category deleted');
          renderPortfolioPanel(panel, content);
        });
      });
    }

    function renderTestimonialsPanel(panel, content){
      var t = content.testimonials;
      panel.innerHTML =
        '<div class="content-block">'
          + '<h3>Section heading</h3>'
          + '<p class="muted" style="font-size:12.5px;margin-top:-6px;">The testimonials themselves are submitted by models and brands directly (via "Share your story" on the homepage) and moderated from the Testimonials tab. This panel only edits the heading text above them.</p>'
          + '<form id="testiHeadForm">'
            + cField('Eyebrow','eyebrow', t.eyebrow)
            + cField('Title','title', t.title)
            + '<button type="submit" class="btn-primary">Save</button>'
          + '</form>'
        + '</div>';

      document.getElementById('testiHeadForm').addEventListener('submit', function(e){
        e.preventDefault();
        var f = e.target;
        t.eyebrow = f.eyebrow.value.trim();
        t.title = f.title.value.trim();
        saveContent(content);
        toast('Saved');
      });
    }

    function renderAboutPanel(panel, content){
      var about = content.about;
      panel.innerHTML =
        '<div class="content-block">'
          + '<h3>About text</h3>'
          + '<form id="aboutTextForm">'
            + cField('Eyebrow','eyebrow', about.eyebrow)
            + cField('Title','title', about.title)
            + '<div class="field"><label>Paragraph 1</label><textarea name="body1" rows="3">'+esc(about.body1)+'</textarea></div>'
            + '<div class="field"><label>Paragraph 2</label><textarea name="body2" rows="3">'+esc(about.body2)+'</textarea></div>'
            + '<button type="submit" class="btn-primary">Save</button>'
          + '</form>'
        + '</div>'
        + '<div class="content-block">'
          + '<h3>About photo</h3>'
          + (about.photo
              ? '<div class="image-manager"><div class="image-thumb" style="width:110px;height:138px;"><img src="'+about.photo+'" alt=""><button type="button" class="del-btn" id="aboutPhotoDel" title="Remove">&times;</button></div></div>'
              : '<p class="empty-note" style="text-align:left;margin:10px 0;">No photo set. A placeholder shows instead.</p>')
          + '<div class="field" style="margin-top:14px;"><input type="file" id="aboutPhotoUpload" accept="image/*"></div>'
        + '</div>';

      document.getElementById('aboutTextForm').addEventListener('submit', function(e){
        e.preventDefault();
        var f = e.target;
        about.eyebrow = f.eyebrow.value.trim();
        about.title = f.title.value.trim();
        about.body1 = f.body1.value.trim();
        about.body2 = f.body2.value.trim();
        saveContent(content);
        toast('Saved');
      });

      if (about.photo){
        document.getElementById('aboutPhotoDel').addEventListener('click', function(){
          about.photo = '';
          saveContent(content);
          toast('Photo removed');
          renderAboutPanel(panel, content);
        });
      }

      document.getElementById('aboutPhotoUpload').addEventListener('change', function(e){
        var file = (e.target.files || [])[0];
        if (!file) return;
        fileToCompressedDataUrl(file, 1200, 0.8).then(function(url){
          about.photo = url;
          saveContent(content);
          toast('Photo updated');
          renderAboutPanel(panel, content);
        });
      });
    }

    function renderContactPanel(panel, content){
      var c = content.contact;
      panel.innerHTML =
        '<div class="content-block">'
          + '<h3>Contact details</h3>'
          + '<form id="contactForm">'
            + cField('Email','email', c.email)
            + cField('Phone, with country code (e.g. 233245779127); leave blank to hide','phone', c.phone)
            + cField('WhatsApp number, with country code (e.g. 233551234567); leave blank to hide','whatsapp', c.whatsapp)
            + cField('Based in','location', c.location)
            + cField('Instagram handle (no @)','instagram', c.instagram)
            + cField('TikTok handle (no @)','tiktok', c.tiktok)
            + cField('YouTube handle (no @)','youtube', c.youtube)
            + '<button type="submit" class="btn-primary">Save</button>'
          + '</form>'
        + '</div>';

      document.getElementById('contactForm').addEventListener('submit', function(e){
        e.preventDefault();
        var f = e.target;
        c.email = f.email.value.trim();
        c.phone = f.phone.value.trim().replace(/[^\d]/g, '');
        c.whatsapp = f.whatsapp.value.trim().replace(/[^\d]/g, '');
        c.location = f.location.value.trim();
        c.instagram = f.instagram.value.trim().replace(/^@/, '');
        c.tiktok = f.tiktok.value.trim().replace(/^@/, '');
        c.youtube = f.youtube.value.trim().replace(/^@/, '');
        saveContent(content);
        toast('Contact info saved');
      });
    }
  }

  /* =========================================================
     INIT
     ========================================================= */
  route();
  pollAdminNotifs();
})();
</script>
</body>
</html>
